services:
  klop:
    image: ${KLOP_IMAGE:?Укажите KLOP_IMAGE=ghcr.io/owner/repository:latest в .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      APP_PATH: ${APP_PATH:-}
    volumes:
      - klop-data:/data
    restart: unless-stopped
volumes:
  klop-data:
